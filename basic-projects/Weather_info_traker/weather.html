<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHER_APP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        header {
            width: 100%;
            background-image: linear-gradient(to right, hsla(247, 96%, 49%, 0.871), #4e46f8b7);
            color: rgb(255, 255, 255);
            padding: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 20px;
            box-shadow: 0 4px 15px #323232;
        }

        .container {
            width: 400px;
            height: 560px;
            background-image: linear-gradient(135deg, #00feba, #5b548a);
            margin: 20px auto;
            border-radius: 30px;
            box-shadow: 0 4px 15px #323232;
            border: none;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: aliceblue;
        }

        .search {
            padding: 20px;
            width: 92%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }

        .search input {
            height: 50px;
            border-radius: 30px;
            background-color: #ebfffc;
            color: #555;
            border: none;
            padding: 10px 25px;
            font-size: 18px;
            transition: box-shadow 0.3s ease-in-out;
            flex: 1;
            margin-right: 16px;
        }

        .search input::placeholder {
            color: #555;
        }

        .search input:focus {
            outline: none;
        }

        .search input:hover {
            box-shadow: 0 0 15px #a8a8a8;
        }

        .search button:hover {
            box-shadow: 0 0 15px #a8a8a8;
        }

        .search button {
            width: 50px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background-color: #ebfffc;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: box-shadow 0.3s ease-in-out;
        }

        .search button img {
            width: 24px;
            height: 26px;
        }

        .con {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transform: translateY(560px);
            transition: all 1s ease-in-out;
        }

        .con.show {
            max-height: 600px;
            opacity: 1;
            transform: translateY(0);
        }

        .weather {
            font-size: larger;
        }

        .weather-icon {
            width: 150px;
            height: 150px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .details {
            margin-top: 15px;
            margin-bottom: 10px;
            width: 92%;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            align-items: center;
            gap: 70px;
            padding-left: 40px;
        }

        .col {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .col img {
            width: 40px;
            height: 40px;
        }

        .col p {
            font-size: 18px;
        }

        .error {
            display: none;
            padding: 40px;
        }

        
        .h11 {
            transition: all 1s ease-in-out;
            opacity: 1;
            transform: translateY(0);
        }

        .h11.hide {
            opacity: 0;
            transform: translateY(6000px);
            display: none;

        }
    </style>
</head>

<body>
    <header>
        <p>This side belongs to lucifer</p>
    </header>

    <div class="container">
        <h1 class="h11">WEATHER DETAILS</h1>
        <div class="search">
            <input type="text" placeholder="Enter your city name" spellcheck="false">
            <button><img src="images/search.png"></button>
        </div>
        <div class="error">
            <h1>CITY NOT FOUND</h1>
        </div>
        <div class="con">
            <div class="weather">
                <img src="images/rain.png" class="weather-icon">
                <h1 class="temp">25°C</h1>
                <h2 class="description">Cloudy</h2>
                <h2 class="city">Mhow</h2>
            </div>
            <div class="details">
                <div class="col">
                    <img src="images/humidity.png">
                    <div>
                        <p class="humidity">Humidity</p>
                        <p class="humidity-value">60%</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind.png">
                    <div>
                        <p class="wind">Wind</p>
                        <p class="wind-value">10 km/h</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = 'b26f9654a6763ebd67424bbb3d2107dd';
        const apiUrl = 'https://api.openweathermap.org/data/2.5/weather?units=metric&q=';
        const searchBox = document.querySelector(".search input");
        const searchBtn = document.querySelector(".search button");
        const weatherIcon = document.querySelector(".weather-icon");
        const con = document.querySelector(".con");
        const heading = document.querySelector(".h11");

        async function cheakweather(city) {
            const response = await fetch(apiUrl + city + `&appid=${apiKey}`);
            if (response.status == 404) {
                document.querySelector(".error").style.display = "block";
                con.classList.remove("show");
                heading.classList.remove("hide");
                // heading.style.display = "block"; 
                return;
            } else {
                document.querySelector(".error").style.display = "none";
            }

            var data = await response.json();
            const desc = data.weather[0].description;
            const formattedDesc = desc.charAt(0).toUpperCase() + desc.slice(1);

            document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C";
            document.querySelector(".city").innerHTML = data.name;
            document.querySelector(".description").innerHTML = formattedDesc;
            document.querySelector(".humidity-value").innerHTML = data.main.humidity + "%";
            document.querySelector(".wind-value").innerHTML = data.wind.speed + " km/h";

            if (data.weather[0].main === 'Clouds') {
                weatherIcon.src = "images/clouds.png";
            } else if (data.weather[0].main === 'Rain') {
                weatherIcon.src = "images/rain.png";
            } else if (data.weather[0].main === 'Clear') {
                weatherIcon.src = "images/clear.png";
            } else if (data.weather[0].main === 'Drizzle') {
                weatherIcon.src = "images/drizzle.png";
            } else if (data.weather[0].main === 'Mist') {
                weatherIcon.src = "images/mist.png";
            } else if (data.weather[0].main === 'Haze') {
                weatherIcon.src = "images/haze.png";
            }

            
            con.classList.add("show");
            con.scrollIntoView({ behavior: "smooth" });

    
            heading.classList.add("hide");
        //     setTimeout(() => {
        //         heading.style.display = "";
        //     }, 1000); 
        }
            searchBtn.addEventListener("click", () => {
                cheakweather(searchBox.value);
            });

    </script>
</body>

</html>
