<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(to bottom, #fb9267, #fe4282);
            --secondry-gradient: linear-gradient(to right, #403250, #2c2035);
            --textnumber: rgb(41, 41, 41);
            --textoperator: #e897ae;
        }

        * { margin: 0; padding: 0; }

        header {
            width: 98.7%;
            background-image: linear-gradient(to right, #ffffff, #626262);
            color: black;
            padding: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 17px;
            box-shadow: 0 4px 15px #323232;
        }

        .main {
            margin-bottom: 200px;
            width: 100%;
            height: 94vh;
            background-image: var(--primary-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 23vw;
            height: 70vh;
            margin-bottom: 100px;
            background-image: var(--secondry-gradient);
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px #323232;
        }

        .Answer {
            position: relative;
            margin-top: 1px;
            margin-bottom: 0;
            border-radius: 30px;
            height: 100px;
            width: 23vw;
        }
        .Answer > h2 {
            position: absolute;
            bottom: 2px;
            right: 10px;
            color: white;
            font-size: 40px;
            max-width: 95%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .Answer > p {
            position: absolute;
            bottom: 60px;
            right: 10px;
            color: white;
            font-size: 15px;
        }

        .button_container {
            padding-bottom: 10px;
            margin-top: 5px;    
            margin-left: 8px;
            width: 22vw;
            height: 65vh;
            margin-bottom: 100px;
            background-color: white;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px #323232;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .buttons_bb {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-row-gap: 15px;
            grid-column-gap: 10px;
        }

        .btt.opp { color: var(--textoperator); }

        .btt {
            background: transparent;
            color: var(--textnumber);
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 70%;
            cursor: pointer;
            height: 65px;
            width: 65px;
            box-shadow: 0 0 15px rgba(198, 198, 198, 0.8);
            transition: box-shadow 0.3s ease-in-out;
        }
        
        .btt:active, .equal:active, .btt:focus, .equal:focus {
            animation: moveInBottom 0.4s ease-in-out;
        }
        
        .btt:hover { box-shadow: 0 0 15px #403250; }
        .equal:hover { box-shadow: 0 0 15px #fe4282; }

        @keyframes moveInBottom {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .equal {
            position: absolute;
            right: 46.5%;
            bottom: 35px;
            width: 100px;
            height: 40px;
            background-image: var(--primary-gradient);
            border: none;
            border-radius: 70px;
            font-size: 20px;
            font-weight: bolder;
            transition: box-shadow 0.3s ease-in-out;
        }
    </style>
</head>
<body>
    <header>
        <p>This side belongs to lucifer</p>
    </header>
    <div class="main">
        <div class="container">
            <div class="Answer">
                <p id="display_p"></p>
                <h2 id="display_h2"></h2>
            </div>
            <div class="button_container">
                <div class="buttons_bb">
                    <button class="btt">C</button>
                    <button class="btt">+-</button>
                    <button class="btt">(</button>
                    <button class="btt">)</button>
                    <button class="btt">7</button>
                    <button class="btt">8</button>
                    <button class="btt">9</button>
                    <button class="btt opp">/</button>
                    <button class="btt">4</button>
                    <button class="btt">5</button>
                    <button class="btt">6</button>
                    <button class="btt opp">*</button>
                    <button class="btt">1</button>
                    <button class="btt">2</button>
                    <button class="btt">3</button>
                    <button class="btt opp">-</button>
                    <button class="btt">BACK</button>
                    <button class="btt">0</button>
                    <button class="btt">.</button>
                    <button class="btt opp">+</button>
                </div>
            </div>
            <button id="equal" class="equal">=</button>
        </div>
    </div>

    <script>
        let equal = document.getElementById("equal");
        let dis_h = document.getElementById("display_h2");
        let dis_p = document.getElementById("display_p");
        let collection = Array.from(document.getElementsByClassName("btt"));

        
        function adjustFontSize() {
            let maxLength = 12; 
            if (dis_h.innerHTML.length > maxLength) {
                dis_h.style.fontSize = "25px";
            } else {
                dis_h.style.fontSize = "40px";
            }
        }

        
        collection.forEach(e => {
            e.addEventListener("click", () => {
                let value = e.textContent;

                if (value === "C") {
                    dis_h.innerHTML = "";
                    dis_p.innerHTML = "";
                } else if (value === "BACK") {
                    dis_h.innerHTML = dis_h.innerHTML.slice(0, -1);
                } else if (value === "+-") {
                    if (dis_h.innerHTML.startsWith("-")) {
                        dis_h.innerHTML = dis_h.innerHTML.slice(1);
                    } else {
                        dis_h.innerHTML = "-" + dis_h.innerHTML;
                    }
                } else {
                    dis_h.innerHTML += value;
                }
                adjustFontSize();
            });
        });
        equal.addEventListener("click", () => {
            try {
                let result = eval(dis_h.innerHTML);
                dis_p.innerHTML = dis_h.innerHTML;
                dis_h.innerHTML = result;
                adjustFontSize();
            } catch {
                dis_h.innerHTML = "Error";
            }
        });
    </script>
</body>
</html>
