<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .box {
            position: relative;
            width: 100px;
            height: 100px;
            background-color: steelblue;
            border-radius: 70px;
            bottom: 0;
            left: 0;
            margin-top: 420px;
            animation: ballx 3s linear 1s infinite alternate,bally 600ms cubic-bezier(0.01, 0.49, 0.54, 0.97) 1s infinite alternate;
                     
        }
        .container {
            position: absolute;
            width: 521px;
            height: 521px;
            background-color: lightgray;
            
        }

        @keyframes ballx {
            from{
             left: 0px;   
    
            }
            to{
             left: 430px;
                
            }
        }
        @keyframes bally {
            from{
                transform: translateY(0px);
    
            }
            to{
                transform: translateY(-200px);
    
            }
            
        }

        
    </style>
</head>
<body>
    <div class="container">
        <div class="box">

        </div>
    </div>

</body>
</html>
