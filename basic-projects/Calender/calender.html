<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    header {
      width: 100%;
      background: linear-gradient(to right, white,black);
      color: #fff;
      padding: 12px;
      text-align: center;
      font-weight: 600;
      font-size: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .hero {
      width: 100%;
      height: 92vh;
      background: linear-gradient(135deg, #000000, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 300px;
      height: 320px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      border: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: scale(1.03);
    }

    .leftbox {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    .leftbox h1 {
      font-size: 100px;
      color: #2c2c2c;
      line-height: 1;
    }

    .leftbox p {
      font-size: 20px;
      font-weight: 600;
      color: #2c2c2c;
    }

    .rightbox {
      width: 130px;
      height: 320px;
      background: linear-gradient(180deg, #949494, #444);
      border-radius: 10px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
      box-shadow: 0 2px 35px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .rightbox h2 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .rightbox h3 {
      font-size: 20px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header>
    <p>This side belongs to Lucifer</p>
  </header>
  <div class="hero">
    <div class="container">
      <div class="leftbox">
        <h1 id="date"></h1>
        <p id="day"></p>
      </div>
      <div class="rightbox">
        <h2 id="month"></h2>
        <h3 id="year"></h3>
      </div>
    </div>
  </div>

  <script>
    const dateEl = document.getElementById('date');
    const monthEl = document.getElementById('month');
    const yearEl = document.getElementById('year');
    const dayEl = document.getElementById('day');

    function updateCalendar() {
      const now = new Date();
      dateEl.textContent = now.getDate();
      monthEl.textContent = now.toLocaleString('default', { month: 'long' });
      yearEl.textContent = now.getFullYear();
      dayEl.textContent = now.toLocaleString('default', { weekday: 'long' });
    }

    updateCalendar();
    setInterval(updateCalendar, 60000); 
  </script>
</body>
</html>
